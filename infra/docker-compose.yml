services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce   # local dev only, never in production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The monolith in a container. Behind the "app" profile, so "docker compose up" alone
  # still starts only PostgreSQL for "./mvnw spring-boot:run" (both would want port 8080)
  app:
    profiles: ["app"]
    build: ../monolith
    image: ecommerce-monolith:latest
    container_name: ecommerce-app
    depends_on:
      postgres:
        condition: service_healthy   # waits for pg_isready, not only for the container start
    # Optional secrets and admin account (JWT_SECRET, ADMIN_EMAIL...): copy .env.example to .env
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ecommerce   # the service name, not localhost
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
    ports:
      - "8080:8080"

volumes:
  postgres_data:
