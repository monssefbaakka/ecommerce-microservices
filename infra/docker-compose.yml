# Log rotation of every container of the stack
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"           # rotated at 10 MB, 3 files kept: the logs of a container never grow past 30 MB
    max-file: "3"

# Settings shared by every Spring container (the monolith, Eureka, the services and the gateway),
# merged into each one with "<<: *spring-container". A key set in the service itself wins
x-spring-container: &spring-container
  profiles: ["app"]
  restart: unless-stopped     # restarts after a crash or a Docker restart, not after "docker compose stop"
  deploy:
    resources:
      limits:
        # The JVM takes 75% of it as heap (-XX:MaxRAMPercentage=75.0 in the Dockerfiles). Without a limit,
        # each of the 7 JVMs would size its heap from the whole memory given to Docker
        memory: 512M
  logging: *logging

# Tracing settings of every Spring container that serves requests, merged into its "environment" with
# "<<: *tracing": the spans go to the Zipkin container below (http://localhost:9411)
x-tracing: &tracing
  ZIPKIN_ENABLED: "true"
  ZIPKIN_URL: http://zipkin:9411/api/v2/spans
  # Share of the requests whose spans are kept: all of them here, e.g. 0.1 under real traffic
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}

# Account the Prometheus container reads /actuator/prometheus with, merged into the "environment" of the
# monolith and the services with "<<: *metrics-scraper". Prometheus gets the same values from the
# "configs" at the end of this file
x-metrics-scraper: &metrics-scraper
  METRICS_USERNAME: ${METRICS_USERNAME:-prometheus}
  METRICS_PASSWORD: ${METRICS_PASSWORD:-metrics-dev-only}   # local dev only: set it in infra/.env on a server

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce   # local dev only, never in production
    networks:   # only the containers that have a database reach it
      - database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates auth_db, product_db, order_db and payment_db next to "ecommerce" (the monolith) on the
      # first start only: on an existing volume, run "docker compose down -v" once (deletes the data)
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The monolith in a container. Behind the "app" profile, so "docker compose up" alone
  # still starts only PostgreSQL for "./mvnw spring-boot:run" (both would want port 8080)
  app:
    <<: *spring-container
    build: ../monolith
    image: ecommerce-monolith:latest
    container_name: ecommerce-app
    depends_on:
      postgres:
        condition: service_healthy   # waits for pg_isready, not only for the container start
    # Optional secrets and admin account (JWT_SECRET, ADMIN_EMAIL...): copy .env.example to .env
    env_file:
      - path: .env
        required: false
    environment:
      <<: [*tracing, *metrics-scraper]
      DB_URL: jdbc:postgresql://postgres:5432/ecommerce   # the service name, not localhost
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
    networks:
      - backend
      - database
    ports:
      - "8080:8080"

  # Service registry: every service and the gateway register here and find each other by name
  discovery-server:
    <<: *spring-container
    build: ../services/discovery-server
    image: ecommerce-discovery-server:latest
    container_name: ecommerce-discovery-server
    environment:
      EUREKA_HOSTNAME: discovery-server
    networks:   # no database: PostgreSQL is not even resolvable from here
      - backend
    ports:
      - "8761:8761"             # Eureka dashboard on http://localhost:8761

  auth-service:
    <<: *spring-container
    build: ../services/auth-service
    image: ecommerce-auth-service:latest
    container_name: ecommerce-auth-service
    depends_on:
      discovery-server:
        condition: service_healthy
      # Its own database on the shared PostgreSQL server (created by init-databases.sql)
      postgres:
        condition: service_healthy
    # Same JWT_SECRET as the monolith, or the monolith would reject the tokens issued here
    env_file:
      - path: .env
        required: false
    environment:
      <<: [*tracing, *metrics-scraper]
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      EUREKA_URL: http://discovery-server:8761/eureka
      INSTANCE_HOSTNAME: auth-service   # address registered in Eureka, reachable by the gateway
    networks:
      - backend
      - database
    ports:
      - "8081:8081"

  product-service:
    <<: *spring-container
    build: ../services/product-service
    image: ecommerce-product-service:latest
    container_name: ecommerce-product-service
    depends_on:
      discovery-server:
        condition: service_healthy
      # Its own database on the shared PostgreSQL server (created by init-databases.sql)
      postgres:
        condition: service_healthy
    # Same JWT_SECRET as auth-service, or the ADMIN tokens would be rejected here
    env_file:
      - path: .env
        required: false
    environment:
      <<: [*tracing, *metrics-scraper]
      DB_URL: jdbc:postgresql://postgres:5432/product_db
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      EUREKA_URL: http://discovery-server:8761/eureka
      INSTANCE_HOSTNAME: product-service   # address registered in Eureka, reachable by the gateway
    networks:
      - backend
      - database
    ports:
      - "8082:8082"

  order-service:
    <<: *spring-container
    build: ../services/order-service
    image: ecommerce-order-service:latest
    container_name: ecommerce-order-service
    depends_on:
      discovery-server:
        condition: service_healthy
      # Its own database on the shared PostgreSQL server (created by init-databases.sql)
      postgres:
        condition: service_healthy
    # Same JWT_SECRET as auth-service, or the tokens would be rejected here
    env_file:
      - path: .env
        required: false
    environment:
      <<: [*tracing, *metrics-scraper]
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      EUREKA_URL: http://discovery-server:8761/eureka
      INSTANCE_HOSTNAME: order-service   # address registered in Eureka, reachable by the gateway
    networks:
      - backend
      - database
    ports:
      - "8083:8083"

  payment-service:
    <<: *spring-container
    build: ../services/payment-service
    image: ecommerce-payment-service:latest
    container_name: ecommerce-payment-service
    depends_on:
      discovery-server:
        condition: service_healthy
      # Its own database on the shared PostgreSQL server (created by init-databases.sql)
      postgres:
        condition: service_healthy
    # Same JWT_SECRET as auth-service, or the tokens would be rejected here
    env_file:
      - path: .env
        required: false
    environment:
      <<: [*tracing, *metrics-scraper]
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      EUREKA_URL: http://discovery-server:8761/eureka
      INSTANCE_HOSTNAME: payment-service   # address registered in Eureka, reachable by the gateway
    networks:
      - backend
      - database
    ports:
      - "8084:8084"

  # Single entry point: /api/auth/** to auth-service, /api/products/** and /api/categories/** to product-service,
  # /api/cart/** and /api/orders/** to order-service, /api/payments/** to payment-service (all through Eureka),
  # the rest of /api/** to the monolith
  api-gateway:
    <<: *spring-container
    build: ../services/api-gateway
    image: ecommerce-api-gateway:latest
    container_name: ecommerce-api-gateway
    # Started last, once everything it routes to is ready: the first request through the gateway gets an
    # answer, not a 503 while a service is still starting. "docker compose up --wait" returns at that point.
    # The services do not wait for each other: the Feign calls already go through retries, a circuit breaker
    # and a 503 (and the cart through its fallback) while the other one is not there
    depends_on:
      discovery-server:
        condition: service_healthy
      app:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    environment:
      <<: *tracing
      EUREKA_URL: http://discovery-server:8761/eureka
      INSTANCE_HOSTNAME: api-gateway
      MONOLITH_URL: http://app:8080
    networks:   # no database: PostgreSQL is not even resolvable from here
      - backend
      - edge    # reached by the frontend (and by Caddy on the server)
    ports:
      - "8090:8090"

  # The web shop on http://localhost:3000: the React app built into static files, served by nginx, which
  # sends /api/** to the gateway (same origin, no CORS). Not a Spring container: a few MB of memory, no JVM.
  # It does not wait for the gateway: the pages load at once, the API answers once the gateway is healthy
  frontend:
    build: ../frontend
    image: ecommerce-frontend:latest
    container_name: ecommerce-frontend
    profiles: ["app"]
    restart: unless-stopped
    networks:   # the gateway only: no service, Eureka or PostgreSQL reachable from the public side
      - edge
    ports:
      - "3000:8080"
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *logging

  # Collects the spans of the gateway, the monolith and the services: one trace per request, across every
  # container it went through. UI on http://localhost:9411 (search by trace id, service or duration).
  # Kept in memory: the traces are lost on a restart, fine for following requests, not for an audit
  zipkin:
    image: openzipkin/zipkin:3.6
    container_name: ecommerce-zipkin
    profiles: ["app"]
    restart: unless-stopped
    environment:
      # Oldest spans dropped past this number: the memory stays under the limit below
      MEM_MAX_SPANS: 100000
    networks:   # no database
      - backend      # receives the spans from the Spring containers
      - monitoring   # Grafana, which reads the traces
    ports:
      - "9411:9411"
    # Replaces the HEALTHCHECK of the image, which calls the address given by "hostname -i": with two
    # networks that is two addresses, and the check always fails
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9411/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *logging

  # Reads the metrics of the monolith and the services every 15 s (infra/prometheus/prometheus.yml), finds
  # the services through Eureka, and keeps 15 days of history. Query UI on http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: ecommerce-prometheus
    profiles: ["app"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Whichever comes first: older values are deleted past 15 days or 1 GB on disk
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    configs:
      - source: metrics-username
        target: /etc/prometheus/metrics-username
      - source: metrics-password
        target: /etc/prometheus/metrics-password
    networks:
      - backend      # Eureka, the services and the monolith it scrapes
      - monitoring   # Grafana, which queries it
    ports:
      - "9090:9090"
    # BusyBox wget ships with the image
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  # Dashboards on http://localhost:3001 (admin / GRAFANA_ADMIN_PASSWORD, "admin" in dev): the "E-commerce
  # overview" dashboard on top of Prometheus, and the traces of Zipkin in Explore. Everything comes from
  # infra/grafana (data sources, dashboards), loaded at each start: no volume, a change made in the UI only
  # lasts until the next restart, export it into its JSON file to keep it
  grafana:
    image: grafana/grafana:13.1
    container_name: ecommerce-grafana
    profiles: ["app"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}   # local dev only: set it in infra/.env on a server
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The overview instead of the welcome page after the login
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/ecommerce-overview.json
      # No call to grafana.com from the server (usage statistics, version check)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:   # Prometheus and Zipkin only: Grafana cannot reach a service, Eureka or PostgreSQL
      - monitoring
    ports:
      - "3001:3000"             # 3000 is the frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

# Four networks instead of the default one, each container joins only the ones it needs:
# - backend:    the Spring containers, which find each other through Eureka and call each other (and
#               Prometheus and Zipkin, which read their metrics and receive their spans)
# - database:   PostgreSQL and the containers that own a database in it
# - edge:       the public side, the gateway and the frontend (and Caddy on the server)
# - monitoring: Grafana, Prometheus and Zipkin
# The gateway and Eureka are not on "database": a flaw in the public entry point cannot reach PostgreSQL.
# The frontend is only on "edge": it reaches the gateway, nothing behind it.
# The published ports (8090, 5432...) still work from the host: only container to container traffic is split.
networks:
  backend:
    name: ecommerce-backend
  database:
    name: ecommerce-database
  edge:
    name: ecommerce-edge
  monitoring:
    name: ecommerce-monitoring

volumes:
  postgres_data:
  prometheus_data:   # the metrics history: kept across restarts and deploys

# Files mounted into the containers, written by Docker Compose from the variables (and their dev defaults)
configs:
  metrics-username:
    content: ${METRICS_USERNAME:-prometheus}
  metrics-password:
    content: ${METRICS_PASSWORD:-metrics-dev-only}
