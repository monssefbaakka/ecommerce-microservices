spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # Without them, a service that hangs holds the request (and a connection) forever
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:2000}   # ms: nothing answers = 503
            # Longer than two calls between services in a row (5 s read timeout each, e.g. find the
            # order then mark it paid): their own 503 comes first. Past it, the gateway gives a 504
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:15s}
          # Checked in this order, the first matching route wins
          routes:
            # lb:// = the address comes from Eureka, with load balancing between the instances
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**,/api/categories/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/cart/**,/api/orders/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
            # Everything not extracted yet still lives in the monolith.
            # Fixed URL: the monolith does not register in Eureka. Must stay after the routes above
            - id: monolith
              uri: ${MONOLITH_URL:http://localhost:8080}
              predicates:
                - Path=/api/**

server:
  port: ${PORT:8090}                    # 8080 stays the monolith's port while it still runs on its own

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5  # dev: sees a new or stopped service within seconds (default 30 s)
  instance:
    hostname: ${INSTANCE_HOSTNAME:localhost}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        # No "gateway" endpoint: it lists the routes and can change them, and the gateway is public
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true                   # /actuator/health/liveness and /actuator/health/readiness
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: API gateway (single entry point of the platform)
