spring:
  application:
    name: product-service               # also the name it registers under in Eureka
  datasource:
    # Its own database: the catalog and the stock live only here. order-service asks for them over HTTP
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  flyway:
    # A database created by Hibernate before Flyway (#115) already has the tables of V1 and V2:
    # instead of failing on a non-empty schema, Flyway records it as version 2 and runs what comes after
    baseline-on-migrate: true
    baseline-version: 2
    baseline-description: schema created by Hibernate before Flyway
  jpa:
    hibernate:
      # Flyway owns the schema: Hibernate only checks that every entity has its table and columns,
      # and stops the startup otherwise (a migration forgotten next to an entity change)
      ddl-auto: validate
    open-in-view: false

springdoc:
  default-produces-media-type: application/json   # instead of */* on every response
  swagger-ui:
    persist-authorization: true         # keeps the token after a page reload
    tags-sorter: alpha
    operations-sorter: method

server:
  port: ${PORT:8082}
  error:
    include-message: always             # show error messages (dev only)

jwt:
  # Must be the same key as auth-service, which issues the tokens.
  # dev only: override with the JWT_SECRET env variable outside local dev
  secret: ${JWT_SECRET:urSFJ7E1nhn9jjr73kPXdYlWW9zKQeTdT2jhx+KVFI4=}   # Base64, at least 256 bits (HS256)

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true                     # sends the Actuator status: DOWN (database lost) = no more traffic
    instance-info-replication-interval-seconds: 10   # dev: status changes reach Eureka in 10 s (default 30 s)
  instance:
    # Address given to the others: localhost in dev, the service name in Docker
    hostname: ${INSTANCE_HOSTNAME:localhost}
    # Dev: a heartbeat every 10 s, removed 30 s after the last one (defaults: 30 s / 90 s)
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30


management:
  tracing:
    sampling:
      # Share of the requests whose spans are sent to Zipkin: all of them in dev, lower under real traffic.
      # The trace id is in the log lines of every request, sampled or not
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        # Off unless a Zipkin is there to receive the spans: "./mvnw spring-boot:run" alone sends nothing.
        # Docker Compose turns it on with the address of its Zipkin container
        enabled: ${ZIPKIN_ENABLED:false}
        endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      # Added to every metric: tells the services apart once their metrics are collected in one place
      application: ${spring.application.name}
    distribution:
      # Latency buckets on the HTTP requests: Prometheus computes the percentiles (p95,
      # p99) over any time range and every instance, which the count and total of /actuator/metrics cannot
      percentiles-histogram:
        http.server.requests: true
  health:
    eureka:
      # This indicator reports the status Eureka holds for us, which itself comes from our health:
      # once DOWN (e.g. at startup), the service would stay DOWN forever. Not needed in our own health
      enabled: false
  endpoints:
    web:
      exposure:
        # metrics, flyway: ADMIN token only (SecurityConfig); prometheus: the scraper account only
        # (MetricsScrapeSecurityConfig); nothing else over HTTP
        include: health,info,metrics,flyway,prometheus
  endpoint:
    health:
      # Anyone sees {"status":"UP"}; only an ADMIN token sees each component (db, disk space...)
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      probes:
        enabled: true                   # /actuator/health/liveness and /actuator/health/readiness
      group:
        # Liveness never checks the database (an outage must not restart the service), readiness does
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Catalog service (categories and products)
