spring:
  application:
    name: order-service                 # also the name it registers under in Eureka
  datasource:
    # Its own database: carts and orders only. The products and their stock live in product-service,
    # the accounts in auth-service (the JWT gives the email)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: update                  # dev: Hibernate creates and updates the cart and order tables
    open-in-view: false
  cloud:
    openfeign:
      client:
        config:
          # Every Feign client of the service. The defaults (10 s to connect, 60 s to read) would hold
          # the request of the user for a minute when product-service hangs: a 503 comes much sooner
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:2000}   # ms
            read-timeout: ${FEIGN_READ_TIMEOUT:5000}         # ms
            # Method, URL, status and time of each call; never the headers, so never the SERVICE token
            logger-level: basic

springdoc:
  default-produces-media-type: application/json   # instead of */* on every response
  swagger-ui:
    persist-authorization: true         # keeps the token after a page reload
    tags-sorter: alpha
    operations-sorter: method

server:
  port: ${PORT:8083}
  error:
    include-message: always             # show error messages (dev only)

jwt:
  # Must be the same key as auth-service, which issues the tokens.
  # dev only: override with the JWT_SECRET env variable outside local dev
  secret: ${JWT_SECRET:urSFJ7E1nhn9jjr73kPXdYlWW9zKQeTdT2jhx+KVFI4=}   # Base64, at least 256 bits (HS256)
  # Lifetime of the SERVICE token signed for each call to product-service
  service-token-validity: 5m

# No address for product-service: its Feign client is resolved by name through Eureka.
# A fixed address (no Eureka) can be set with spring.cloud.openfeign.client.config.product-service.url

resilience4j:
  circuitbreaker:
    instances:
      # Every call to product-service, reads and writes (RemoteCalls), counted once after its retries.
      # Once half of the last calls failed or were slow, it opens: the calls give a 503 at once
      # instead of waiting for the timeouts
      product-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10                     # judged on the last 10 calls...
        minimum-number-of-calls: 5                  # ...once there are at least 5
        failure-rate-threshold: 50                  # % of failed calls that opens it
        slow-call-duration-threshold: 3s            # a call slower than this counts as slow...
        slow-call-rate-threshold: 50                # ...and half of them slow opens it too
        wait-duration-in-open-state: 10s            # then lets a few calls through to test product-service
        permitted-number-of-calls-in-half-open-state: 3
        # Only what says product-service is unwell. A 404 / 409 is an answer: it counts as a success
        record-exceptions:
          - feign.FeignException                                         # refused, dropped, timeout
          - com.monssef.orderservice.client.ServiceUnavailableException  # 5xx, not in Eureka
  retry:
    instances:
      # 3 attempts at most, 200 ms then 400 ms apart. Worst case for a read: 3 quick failures + 0.6 s.
      # A timeout is never retried, so a hanging product-service still costs one read timeout (5 s)
      product-service-reads:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Refused, dropped, 5xx, not in Eureka yet: never a timeout, a 404 or a 409
        retry-exception-predicate: com.monssef.orderservice.client.RetryableReadFailure
      product-service-writes:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Only when the request never reached product-service: the stock is never reserved twice
        retry-exception-predicate: com.monssef.orderservice.client.RequestNeverSent

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true                     # sends the Actuator status: DOWN (database lost) = no more traffic
    instance-info-replication-interval-seconds: 10   # dev: status changes reach Eureka in 10 s (default 30 s)
  instance:
    # Address given to the others: localhost in dev, the service name in Docker
    hostname: ${INSTANCE_HOSTNAME:localhost}
    # Dev: a heartbeat every 10 s, removed 30 s after the last one (defaults: 30 s / 90 s)
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    # Feign logs at DEBUG only: one line per call to the other service and one per answer
    com.monssef.orderservice.product.ProductServiceApi: DEBUG

management:
  metrics:
    tags:
      # Added to every metric: tells the services apart once their metrics are collected in one place
      application: ${spring.application.name}
  health:
    eureka:
      # This indicator reports the status Eureka holds for us, which itself comes from our health:
      # once DOWN (e.g. at startup), the service would stay DOWN forever. Not needed in our own health
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics    # metrics: ADMIN token only (SecurityConfig); nothing else over HTTP
  endpoint:
    health:
      # Anyone sees {"status":"UP"}; only an ADMIN token sees each component (db, disk space...)
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      probes:
        enabled: true                   # /actuator/health/liveness and /actuator/health/readiness
      group:
        # Liveness never checks the database (an outage must not restart the service), readiness does
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Cart and order service
