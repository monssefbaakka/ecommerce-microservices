spring:
  application:
    name: auth-service                  # also the name it registers under in Eureka
  datasource:
    # Same database as the monolith for now: both read and write the "users" table.
    # Each service gets its own database in #46
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: update                  # dev: same mapping as the monolith, so the shared table stays identical
    open-in-view: false

server:
  port: ${PORT:8081}
  error:
    include-message: always             # show error messages (dev only)

jwt:
  # Must be the same key as in the services that check the tokens (the monolith for now).
  # dev only: override with the JWT_SECRET env variable outside local dev
  secret: ${JWT_SECRET:urSFJ7E1nhn9jjr73kPXdYlWW9zKQeTdT2jhx+KVFI4=}   # Base64, at least 256 bits (HS256)
  expiration: ${JWT_EXPIRATION:1h}

app:
  admin:
    # optional: creates an ADMIN account at startup when both are set and the email is free
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info            # nothing else over HTTP
  endpoint:
    health:
      # Anyone sees {"status":"UP"}; only an ADMIN token sees each component (db, disk space...)
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      probes:
        enabled: true                   # /actuator/health/liveness and /actuator/health/readiness
      group:
        # Liveness never checks the database (an outage must not restart the service), readiness does
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Authentication service (accounts, register, login, JWT)
