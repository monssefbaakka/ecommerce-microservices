name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push on a pull request branch cancels its run still in progress: only the last commit matters.
# Never on main, where each merged commit keeps its own result
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The jobs only read the code: the GITHUB_TOKEN cannot push, comment or change anything
permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # One failing project does not cancel the others: every broken project is reported at once
      fail-fast: false
      matrix:
        # Each one is a separate Maven project with its own wrapper: one job each, run in parallel.
        # "name" names the job and its artifacts (no "/" allowed there), "path" is the project folder
        include:
          - { name: monolith, path: monolith }
          - { name: discovery-server, path: services/discovery-server }
          - { name: auth-service, path: services/auth-service }
          - { name: product-service, path: services/product-service }
          - { name: order-service, path: services/order-service }
          - { name: payment-service, path: services/payment-service }
          - { name: api-gateway, path: services/api-gateway }
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          # ~/.m2/repository restored between runs, one cache per project (keyed on its pom.xml):
          # the dependencies are downloaded again only when that pom.xml changes
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml

      # One Maven run for the whole lifecycle: compile, unit and slice tests (*Test), package the
      # executable jar, then the integration tests (*IT) against that jar's classes on a PostgreSQL
      # started by Testcontainers (Docker is already running on the GitHub-hosted Ubuntu runners)
      - name: Build, test and package
        working-directory: ${{ matrix.path }}
        run: ./mvnw -B verify

      # Without Docker the *IT classes are skipped, not failed (disabledWithoutDocker = true): fine on a
      # laptop, but in CI a green run must mean they ran. discovery-server and api-gateway have no *IT
      - name: Check that no integration test was skipped
        working-directory: ${{ matrix.path }}
        run: |
          summary=target/failsafe-reports/failsafe-summary.xml
          if [ ! -f "$summary" ]; then
            echo "No integration tests in this project"
            exit 0
          fi
          skipped=$(sed -n 's:.*<skipped>\([0-9]*\)</skipped>.*:\1:p' "$summary")
          if [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::$skipped integration test(s) skipped: is Docker available on the runner?"
            exit 1
          fi
          echo "Every integration test ran"

      # The tested Spring Boot jar, kept with the run ("java -jar" runs it). target/*.jar leaves out
      # the *.jar.original that the repackaging leaves next to it
      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.name }}
          path: ${{ matrix.path }}/target/*.jar
          retention-days: 7
          if-no-files-found: error

      # HTML coverage report of the unit + integration tests (open index.html once downloaded).
      # discovery-server and api-gateway have no JaCoCo: nothing to upload for them
      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.path }}/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      # The full output of each failed test (stack trace, Spring and Testcontainers logs), downloadable
      # from the run page: the job log only shows a summary
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            ${{ matrix.path }}/target/surefire-reports/
            ${{ matrix.path }}/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore
