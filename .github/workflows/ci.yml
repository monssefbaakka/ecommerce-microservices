name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      # One failing project does not cancel the others: every broken project is reported at once
      fail-fast: false
      matrix:
        # Each one is a separate Maven project with its own wrapper: one job each, run in parallel
        project:
          - monolith
          - services/discovery-server
          - services/auth-service
          - services/product-service
          - services/order-service
          - services/payment-service
          - services/api-gateway
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          # ~/.m2/repository restored between runs, one cache per project (keyed on its pom.xml):
          # the dependencies are downloaded again only when that pom.xml changes
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml

      # Unit and slice tests (*Test), then the integration tests (*IT) on a PostgreSQL started by
      # Testcontainers: Docker is already running on the GitHub-hosted Ubuntu runners
      - name: Run the tests
        working-directory: ${{ matrix.project }}
        run: ./mvnw -B verify
