spring:
  application:
    name: ecommerce-monolith
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}   # in Docker: the postgres service host
    username: ${DB_USER:ecommerce}      # default value if the variable is not set
    password: ${DB_PASSWORD:ecommerce}
  flyway:
    # A database created by Hibernate before Flyway (#114) already has the tables of V1 to V5:
    # instead of failing on a non-empty schema, Flyway records it as version 5 and runs what comes after
    baseline-on-migrate: true
    baseline-version: 5
    baseline-description: schema created by Hibernate before Flyway
  jpa:
    hibernate:
      # Flyway owns the schema: Hibernate only checks that every entity has its table and columns,
      # and stops the startup otherwise (a migration forgotten next to an entity change)
      ddl-auto: validate
    open-in-view: false                 # best practice: no open session in controllers
    properties:
      hibernate:
        format_sql: true

springdoc:
  default-produces-media-type: application/json   # instead of */* on every response
  swagger-ui:
    persist-authorization: true         # keeps the token after a page reload
    tags-sorter: alpha
    operations-sorter: method

server:
  port: 8080
  error:
    include-message: always             # show error messages (dev only)

jwt:
  # dev only: override with the JWT_SECRET env variable outside local dev
  secret: ${JWT_SECRET:urSFJ7E1nhn9jjr73kPXdYlWW9zKQeTdT2jhx+KVFI4=}   # Base64, at least 256 bits (HS256)
  expiration: ${JWT_EXPIRATION:1h}

app:
  admin:
    # optional: creates an ADMIN account at startup when both are set and the email is free
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  tracing:
    sampling:
      # Share of the requests whose spans are sent to Zipkin: all of them in dev, lower under real traffic.
      # The trace id is in the log lines of every request, sampled or not
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        # Off unless a Zipkin is there to receive the spans: "./mvnw spring-boot:run" alone sends nothing.
        # Docker Compose turns it on with the address of its Zipkin container
        enabled: ${ZIPKIN_ENABLED:false}
        endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      # Added to every metric: tells the services apart once their metrics are collected in one place
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway   # metrics, flyway: ADMIN token only; env, beans, heapdump... stay closed
  endpoint:
    health:
      # Anyone sees {"status":"UP"}; only an ADMIN token sees each component (db, disk space...)
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      probes:
        enabled: true                   # /actuator/health/liveness and /actuator/health/readiness
      group:
        # Liveness = the process works: never the database, or a database outage would restart the app.
        # Readiness = it can serve requests: needs the database
        liveness:
          include: livenessState        # declared like readiness, so an ADMIN also sees what it checks
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true                     # shows the info.* properties below
    java:
      enabled: true                     # Java version and vendor of the running JVM

info:
  app:
    name: ${spring.application.name}
    description: E-commerce monolith (catalog, cart, orders)
