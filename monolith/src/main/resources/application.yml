spring:
  application:
    name: ecommerce-monolith
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}   # in Docker: the postgres service host
    username: ${DB_USER:ecommerce}      # default value if the variable is not set
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: update                  # dev: Hibernate creates/updates the tables
    open-in-view: false                 # best practice: no open session in controllers
    properties:
      hibernate:
        format_sql: true

springdoc:
  default-produces-media-type: application/json   # instead of */* on every response
  swagger-ui:
    persist-authorization: true         # keeps the token after a page reload
    tags-sorter: alpha
    operations-sorter: method

server:
  port: 8080
  error:
    include-message: always             # show error messages (dev only)

jwt:
  # dev only: override with the JWT_SECRET env variable outside local dev
  secret: ${JWT_SECRET:urSFJ7E1nhn9jjr73kPXdYlWW9zKQeTdT2jhx+KVFI4=}   # Base64, at least 256 bits (HS256)
  expiration: ${JWT_EXPIRATION:1h}

app:
  admin:
    # optional: creates an ADMIN account at startup when both are set and the email is free
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info            # nothing else over HTTP: env, beans, heapdump... stay closed
  endpoint:
    health:
      # Anyone sees {"status":"UP"}; only an ADMIN token sees each component (db, disk space...)
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      probes:
        enabled: true                   # /actuator/health/liveness and /actuator/health/readiness
      group:
        # Liveness = the process works: never the database, or a database outage would restart the app.
        # Readiness = it can serve requests: needs the database
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true                     # shows the info.* properties below
    java:
      enabled: true                     # Java version and vendor of the running JVM

info:
  app:
    name: ${spring.application.name}
    description: E-commerce monolith (catalog, cart, orders)
